plugins {
    id "com.android.application"
}

android {
    namespace "org.libsdl.app"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "id.growlander.prototype"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/jni/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// Ensure the shared native library and SDL dependencies exist before assets are
// merged into the APK; the root CMake project is deliberately not modified.
tasks.configureEach {
    if (name.startsWith("merge") && name.endsWith("Assets")) {
        dependsOn(tasks.matching { it.name.startsWith("externalNativeBuild") })
    }
}
